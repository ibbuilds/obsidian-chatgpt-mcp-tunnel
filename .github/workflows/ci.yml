name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, feat/initial-plugin]
  pull_request:

jobs:
  verify:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Production bundle
        run: npm run bundle
      - name: Browser interaction checks
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:browser
      - name: Official Windows client smoke test
        # Explicit only: GitHub's unauthenticated release API is rate-limited on shared CI IPs.
        if: matrix.os == 'windows-latest' && github.event_name == 'workflow_dispatch'
        run: npm run smoke:client
